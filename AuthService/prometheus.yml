global:
  scrape_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['host.docker.internal:9093']

scrape_configs:
  - job_name: 'prometheus'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.yml
    basic_auth:
      username: <secret>
      password: <secret>
