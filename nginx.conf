user root;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Определим зону лимитов по IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    
    # Ограничим количество одновременных соединений с одного IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        server_name chatflowonline.ru;
        
        location /swagger-ms1/ {
            proxy_pass http://auth-service:5000/swagger-ms1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /backend-a/ {
                proxy_pass http://auth-service:5000/backend-a/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        
                # Ограничение скорости и соединений
                limit_req zone=api_limit burst=3;
                limit_conn conn_limit 5;
                proxy_cache_valid 429 5s;
        }
        
        location /swagger-ms2/ {
                proxy_pass http://chat-service:8000/swagger-ms2/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /backend-b/ {
                proxy_pass http://chat-service:8000/backend-b/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        
                # Ограничение скорости и соединений
                limit_req zone=api_limit burst=3;
                limit_conn conn_limit 5;
        }
        
        location /swagger-ms3/ {
            proxy_pass http://message-service:9001/swagger-ms3/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /backend-c/ {
                proxy_pass http://message-service:9001/backend-c/;
