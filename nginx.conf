load_module modules/ngx_http_modsecurity_module.so;

user root;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity/modsecurity.conf;

    # Определим зону лимитов по IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    
    # Ограничим количество одновременных соединений с одного IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    
    # формат лога
    log_format timed_combined
       '$remote_addr - $remote_user [$time_local] '
       '"$request" $status $body_bytes_sent '
       '"$http_referer" "$http_user_agent" '
       'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';


    server {
        listen 80;
        listen [::]:80;
        server_name api.chatflowonline.ru;
        
        return 301 https://$host$request_uri;
    }
    
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name chatflowonline.ru;
    
        ssl_certificate /etc/letsencrypt/live/chatflowonline.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chatflowonline.ru/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
        location / {
            access_log off;
            root /usr/share/nginx/static;
            index Watermelon.png;
        }
    }
    
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.chatflowonline.ru;
    
        ssl_certificate /etc/letsencrypt/live/api.chatflowonline.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.chatflowonline.ru/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        
        add_header X-Frame-Options "DENY" always; # Clickjacking
        add_header X-Content-Type-Options "nosniff" always; # MIME sniffing
        add_header X-XSS-Protection "1; mode=block" always; # Защита от XSS
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=()" always;
        
        location /swagger/ {
            proxy_pass http://chat-flow:8080/swagger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /metrics {
            access_log off;
            proxy_pass http://chat-flow:8080/metrics/;
                    
            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location / {
            access_log /var/log/nginx/chatflow.log timed_combined;
            proxy_pass http://chat-flow:8080/;
            
            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket-заголовки
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
                
            # Ограничение скорости и соединений
            limit_req zone=api_limit burst=3;
            limit_conn conn_limit 5;
            proxy_cache_valid 429 5s;
        }
    }
}