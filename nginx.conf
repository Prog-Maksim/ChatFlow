                proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /backend-e/ {
                proxy_pass http://search-service:7000/backend-e/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        
                # Ограничение скорости и соединений
                limit_req zone=api_limit burst=3;
                limit_conn conn_limit 5;
        }
        
        location /swagger-ms6/ {
                proxy_pass http://websocket-service:10000/swagger-ms6/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /backend-f/ {
                proxy_pass http://websocket-service:10000/backend-f/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        
                # Ограничение скорости и соединений
                limit_req zone=api_limit burst=3;
                limit_conn conn_limit 5;
        }
        
        
