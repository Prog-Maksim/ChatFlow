                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        
                # Ограничение скорости и соединений
                limit_req zone=api_limit burst=3;
                limit_conn conn_limit 5;
        }
        
        location /swagger-ms4/ {
                proxy_pass http://profile-service:4000/swagger-ms4/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /backend-d/ {
                proxy_pass http://profile-service:4000/backend-d/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        
                # Ограничение скорости и соединений
                limit_req zone=api_limit burst=3;
                limit_conn conn_limit 5;
        }
        
        location /swagger-ms5/ {
                proxy_pass http://search-service:7000/swagger-ms5/;
