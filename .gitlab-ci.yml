image: docker:24.0.7

stages:
  - build
  - deploy

# ──────── BUILD JOBS ────────

build-chatflow-service-job:
  stage: build
  tags:
    - dev
  script:
    - docker build -t chatflow-service -f Backend/ChatFlow/Dockerfile Backend/ChatFlow
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "create-tests"'

# ──────── DEPLOY JOB ────────

deploy-job:
  stage: deploy
  tags:
    - dev
  script:
    - docker compose down
    - docker compose build --no-cache
    - docker compose up -d --force-recreate
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "create-tests"'