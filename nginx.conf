user root;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # Определим зону лимитов по IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    
    # Ограничим количество одновременных соединений с одного IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    server {
        listen 80;
        listen [::]:80;
        server_name api.chatflowonline.ru;
        
        return 301 https://$host$request_uri;
    }
    
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.chatflowonline.ru;
    
        ssl_certificate /etc/letsencrypt/live/api.chatflowonline.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.chatflowonline.ru/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        
        
                location /swagger-ms1/ {
                    proxy_pass http://auth-service:8080/swagger-ms1/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
                location /a/ {
                        proxy_pass http://auth-service:8080/a/;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                
                        # Ограничение скорости и соединений
                        limit_req zone=api_limit burst=3;
                        limit_conn conn_limit 5;
                        proxy_cache_valid 429 5s;
                }
                
                location /swagger-ms2/ {
                        proxy_pass http://chat-service:8080/swagger-ms2/;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                }
                location /b/ {
                        proxy_pass http://chat-service:8080/b/;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                
                        # Ограничение скорости и соединений
                        limit_req zone=api_limit burst=3;
                        limit_conn conn_limit 5;
                }
                
                location /swagger-ms3/ {
                    proxy_pass http://message-service:8080/swagger-ms3/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
                location /c/ {
                        proxy_pass http://message-service:8080/c/;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                
                        # Ограничение скорости и соединений
                        limit_req zone=api_limit burst=3;
                        limit_conn conn_limit 5;
                }
                
                location /swagger-ms4/ {
                        proxy_pass http://profile-service:8080/swagger-ms4/;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                }
                location /d/ {
                        proxy_pass http://profile-service:8080/d/;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                
                        # Ограничение скорости и соединений
                        limit_req zone=api_limit burst=3;
                        limit_conn conn_limit 5;
                }
                
                location /swagger-ms5/ {
                        proxy_pass http://search-service:8080/swagger-ms5/;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                }
                location /e/ {
                        proxy_pass http://search-service:8080/e/;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                
                        # Ограничение скорости и соединений
                        limit_req zone=api_limit burst=3;
                        limit_conn conn_limit 5;
                }
                
                location /swagger-ms6/ {
                        proxy_pass http://websocket-service:8080/swagger-ms6/;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                }
                location /f/ {
                        proxy_pass http://websocket-service:8080/f/;

                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection "Upgrade";

                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                }
    }
}