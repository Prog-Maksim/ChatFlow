image: docker:24.0.7

stages:
  - test

test-auth-service-job:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  tags:
    - prod
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - ~/.nuget/packages/
  script:
    - cd Backend/AuthService
    - dotnet restore
    - dotnet test
      
